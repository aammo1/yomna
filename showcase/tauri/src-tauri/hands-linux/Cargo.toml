# Hands helper for Yomna on Linux (Omarchy / Hyprland Wayland first, with X11 EWMH fallback).
# Twin of hands/main.swift (macOS) and hands-win (Windows): same JSON CLI contract.
[package]
name = "yomna-hands"
version = "1.0.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
x11rb = "=0.14.0"
zbus = "=6.5.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
